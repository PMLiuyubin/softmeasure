[project]
name = "softmeasure"
version = "0.1.0"
description = "侧线甲基萘软测量产品目录"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "openpyxl>=3.1",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
